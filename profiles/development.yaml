id: development
name: Development
description: General software development
aliases: [dev, workstation]

sections:
  - id: core
    title: Core
    components:
      - id: git
        packages: [git]
      - id: curl
        packages: [curl]
      - id: build-essential
        packages: [build-essential]
      - id: jq
        packages: [jq]
      - id: tmux
        packages: [tmux]
      - id: htop
        packages: [htop]

  - id: languages
    title: Languages
    components:
      - id: python3
        packages: [python3]
      - id: uv
        kind: third_party
        packages: [uv]
      - id: nodejs
        name: Node.js
        packages: [nodejs]
      - id: golang
        name: Go
        optional: true
        default: true
        packages: [golang]

  - id: containers
    title: Containers
    components:
      - id: docker
        kind: third_party
        packages: [docker]
        services: [docker]
